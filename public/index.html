<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>אירועים ברמת גן</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Leaflet for map view -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <h1>📅 אירועים ברמת גן</h1>
    <div class="header-actions">
      <span class="greeting" id="greeting"></span>
      <button class="filter-toggle-btn" id="filterToggleBtn" title="סינון">⚙️ סינון</button>
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="list" title="רשימה">☰</button>
        <button class="view-btn" data-view="map" title="מפה">🗺️</button>
      </div>
    </div>
  </div>

  <!-- Collapsible filter panel -->
  <div class="filter-panel" id="filterPanel">
    <!-- Date quick-filters -->
    <div class="filter-section">
      <div class="filter-label">תאריך</div>
      <div class="filter-bar" id="dateFilterBar">
        <button class="chip active" data-date="all">הכל</button>
        <button class="chip" data-date="today">היום</button>
        <button class="chip" data-date="weekend">סוף שבוע</button>
        <button class="chip" data-date="week">השבוע</button>
        <button class="chip" data-date="month">החודש</button>
      </div>
    </div>

    <!-- Type filter -->
    <div class="filter-section">
      <div class="filter-label">סוג</div>
      <div class="filter-bar" id="typeFilterBar">
        <button class="chip active" data-type="all">הכל</button>
        <button class="chip" data-type="registration">📋 מחייב הרשמה</button>
        <button class="chip" data-type="free">🎁 כניסה חופשית</button>
        <button class="chip" data-type="online">💻 אונליין</button>
        <button class="chip" data-type="low_stock">🎫 נשארו מעט כרטיסים</button>
      </div>
    </div>

    <!-- Interest tag filters — populated after profile loads -->
    <div class="filter-section" id="tagsSection" style="display:none">
      <div class="filter-label">תחומי עניין שלי</div>
      <div class="filter-bar" id="tagFilterBar"></div>
    </div>
  </div>
</header>

<!-- Tag drill-down bar (shown when a tag pill is tapped) -->
<div class="drill-bar" id="drillBar" style="display:none"></div>

<div class="search-wrap" id="searchWrap">
  <input
    class="search-input"
    type="search"
    id="searchInput"
    placeholder="חיפוש לפי שם, מיקום או תגית..."
    autocomplete="off"
  />
</div>

<main class="content">
  <div class="spinner-wrap" id="spinner"><div class="spinner"></div></div>
  <div id="error" style="display:none"></div>

  <!-- List view -->
  <div id="catalog" style="display:none">
    <div class="results-meta" id="resultsMeta"></div>
    <div class="card-grid" id="cardGrid"></div>
    <div id="noResults" style="display:none" class="empty-state">
      <div style="font-size:2.5rem">🔍</div>
      <p>לא נמצאו אירועים תואמים</p>
    </div>
  </div>

  <!-- Map view -->
  <div id="mapView" style="display:none">
    <div id="mapContainer"></div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
