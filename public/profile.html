<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>הפרופיל שלי</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <header class="pf-header">
    <a id="pfBack" href="index.html" title="חזרה לאירועים"
       style="display:inline-flex;align-items:center;gap:4px;color:var(--accent,#2f6fed);text-decoration:none;font-weight:700;font-size:.95rem;margin-bottom:6px">← אירועים</a>
    <h1>👤 הפרופיל שלי</h1>
    <p class="pf-sub">עדכנו את ההעדפות — ההמלצות יתעדכנו בהתאם</p>
  </header>

  <main id="pf-root" class="pf-root">
    <div id="pf-loading" class="pf-loading">טוען…</div>
  </main>

  <div id="pf-toast" class="pf-toast" hidden></div>
  <div id="pf-actions" class="pf-actions">
    <button id="pf-save" class="pf-save" type="button">שמירה</button>
    <button id="pf-cancel" class="pf-cancel" type="button">ביטול</button>
  </div>

  <script>
    // Tab bar removed (profile is reached from the catalog search row). Carry
    // the Telegram launch params onto the back link + wire the native
    // BackButton so both routes back to the events catalog stay authenticated.
    (function () {
      var q = location.search + location.hash;
      var back = document.getElementById("pfBack");
      if (back) back.href = back.getAttribute("href") + q;
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.BackButton) {
        try {
          tg.BackButton.show();
          tg.BackButton.onClick(function () { location.href = "index.html" + q; });
        } catch (e) {}
      }
    })();
  </script>

  <script src="profile.js"></script>
</body>
</html>
